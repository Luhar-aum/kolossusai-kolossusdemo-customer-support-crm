[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

[program:fastapi]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2
directory=/app
autostart=true
autorestart=true
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",REDIS_URL="%(ENV_REDIS_URL)s",SECRET_KEY="%(ENV_SECRET_KEY)s",AI_PROVIDER="%(ENV_AI_PROVIDER)s",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",CORS_ORIGINS="%(ENV_CORS_ORIGINS)s",ENCRYPTION_KEY="%(ENV_ENCRYPTION_KEY)s",SYNC_DATABASE_URL="%(ENV_SYNC_DATABASE_URL)s",CELERY_BROKER_URL="%(ENV_CELERY_BROKER_URL)s",CELERY_RESULT_BACKEND="%(ENV_CELERY_RESULT_BACKEND)s"
stdout_logfile=/var/log/supervisor/fastapi.log
stderr_logfile=/var/log/supervisor/fastapi_err.log

[program:migrate]
command=alembic upgrade head
directory=/app
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/var/log/supervisor/migrate.log
stderr_logfile=/var/log/supervisor/migrate_err.log
